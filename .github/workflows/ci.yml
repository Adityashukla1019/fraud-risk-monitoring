name: CI
on: [push, pull_request]
jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Smoke-run the full pipeline on a small sample
        run: |
          python -m src.generate_data --rows 60000
          python -m src.load_db
          python -m src.run_sql_analysis > /dev/null
          python -m src.train > /dev/null
          python -m src.make_memo > /dev/null
